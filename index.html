<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>文字比較練習：大與小</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
        }
        .active-symbol {
            background-color: #fef08a;
            transform: scale(1.1);
            border: 4px solid #f59e0b;
        }
        .text-card {
            transition: all 0.3s ease;
        }
        /* 針對特教需求加強文字辨識度 */
        .big-text { color: #ef4444; } /* 大：紅色 */
        .small-text { color: #3b82f6; } /* 小：藍色 */
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col">

    <!-- 頂部導航 -->
    <header class="bg-white border-b p-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2">
            <div class="bg-blue-500 p-2 rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" />
                </svg>
            </div>
            <h1 class="text-xl font-bold text-slate-700">比一比：選出正確的符號</h1>
        </div>
        <button id="resetBtn" class="px-6 py-2 bg-slate-200 hover:bg-slate-300 rounded-xl font-medium transition-colors">
            換一題
        </button>
    </header>

    <!-- 主操作區 -->
    <main class="flex-1 flex flex-row items-center justify-around p-8 relative">
        
        <!-- 左邊字樣 -->
        <div class="w-1/3 flex justify-center">
            <div id="wordLeft" class="text-card bg-white w-64 h-64 rounded-3xl shadow-xl border-8 border-slate-100 flex items-center justify-center text-9xl font-black">
                大
            </div>
        </div>

        <!-- 中間符號放置點 -->
        <div class="flex flex-col items-center gap-8">
            <div id="resultBox" class="w-40 h-40 flex items-center justify-center bg-slate-100 rounded-3xl border-4 border-dashed border-slate-300 text-8xl font-bold text-slate-400">
                ?
            </div>
            <div id="feedback" class="h-12 text-2xl font-bold text-center">
                <!-- 回饋訊息 -->
            </div>
        </div>

        <!-- 右邊字樣 -->
        <div class="w-1/3 flex justify-center">
            <div id="wordRight" class="text-card bg-white w-64 h-64 rounded-3xl shadow-xl border-8 border-slate-100 flex items-center justify-center text-9xl font-black">
                小
            </div>
        </div>

        <!-- 分隔線 -->
        <div class="absolute inset-0 flex items-center justify-center -z-10 opacity-20 pointer-events-none">
            <div class="w-px h-full bg-slate-400"></div>
        </div>
    </main>

    <!-- 符號選單 -->
    <footer class="bg-white border-t p-10">
        <div class="max-w-4xl mx-auto flex justify-center items-center gap-16">
            <button data-symbol=">" class="symbol-btn w-28 h-28 bg-white border-4 border-slate-200 rounded-2xl flex items-center justify-center text-6xl font-bold hover:border-yellow-400 transition-all shadow-md active:scale-90">
                ＞
            </button>
            <button data-symbol="<" class="symbol-btn w-28 h-28 bg-white border-4 border-slate-200 rounded-2xl flex items-center justify-center text-6xl font-bold hover:border-yellow-400 transition-all shadow-md active:scale-90">
                ＜
            </button>
            <button data-symbol="=" class="symbol-btn w-28 h-28 bg-white border-4 border-slate-200 rounded-2xl flex items-center justify-center text-6xl font-bold hover:border-yellow-400 transition-all shadow-md active:scale-90">
                ＝
            </button>
        </div>
        <p class="text-center mt-8 text-slate-400 text-lg">點選下方的符號放到中間</p>
    </footer>

    <script>
        const words = ["大", "小"];
        let leftText = "";
        let rightText = "";

        const wordLeftEl = document.getElementById('wordLeft');
        const wordRightEl = document.getElementById('wordRight');
        const resultBox = document.getElementById('resultBox');
        const feedback = document.getElementById('feedback');
        const resetBtn = document.getElementById('resetBtn');
        const symbolBtns = document.querySelectorAll('.symbol-btn');

        function initGame() {
            // 隨機選字
            leftText = words[Math.floor(Math.random() * words.length)];
            rightText = words[Math.floor(Math.random() * words.length)];

            // 渲染文字與色彩編碼
            updateWordDisplay(wordLeftEl, leftText);
            updateWordDisplay(wordRightEl, rightText);

            // 重置狀態
            resultBox.innerText = "?";
            resultBox.className = "w-40 h-40 flex items-center justify-center bg-slate-100 rounded-3xl border-4 border-dashed border-slate-300 text-8xl font-bold text-slate-400";
            feedback.innerText = "";
            symbolBtns.forEach(btn => btn.classList.remove('active-symbol'));
        }

        function updateWordDisplay(el, text) {
            el.innerText = text;
            if (text === "大") {
                el.className = "text-card bg-white w-64 h-64 rounded-3xl shadow-xl border-8 border-slate-100 flex items-center justify-center text-9xl font-black big-text";
            } else {
                el.className = "text-card bg-white w-64 h-64 rounded-3xl shadow-xl border-8 border-slate-100 flex items-center justify-center text-9xl font-black small-text";
            }
        }

        function checkAnswer(symbol) {
            let correct = false;
            
            // 邏輯判斷
            if (leftText === "大" && rightText === "小" && symbol === ">") correct = true;
            else if (leftText === "小" && rightText === "大" && symbol === "<") correct = true;
            else if (leftText === rightText && symbol === "=") correct = true;
            else if (leftText === "大" && rightText === "大" && symbol === "=") correct = true;
            else if (leftText === "小" && rightText === "小" && symbol === "=") correct = true;

            resultBox.innerText = symbol;

            if (correct) {
                resultBox.className = "w-40 h-40 flex items-center justify-center bg-green-100 rounded-3xl border-4 border-green-500 text-8xl font-bold text-green-600 shadow-lg scale-110 transition-all";
                feedback.innerText = "答對了！你認字認得很準喔！";
                feedback.className = "h-12 text-2xl font-bold text-center text-green-600";
            } else {
                resultBox.className = "w-40 h-40 flex items-center justify-center bg-red-50 rounded-3xl border-4 border-red-300 text-8xl font-bold text-red-400 transition-all";
                feedback.innerText = "再想一想，開口要朝向「大」的地方。";
                feedback.className = "h-12 text-2xl font-bold text-center text-red-500";
            }
        }

        symbolBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                symbolBtns.forEach(b => b.classList.remove('active-symbol'));
                btn.classList.add('active-symbol');
                checkAnswer(btn.getAttribute('data-symbol'));
            });
        });

        resetBtn.addEventListener('click', initGame);

        window.onload = initGame;
    </script>
</body>
</html>
